<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart — meto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="wrap">
      <header class="site-header" id="site-header"></header>
      <h1>Cart</h1>
      <p class="lede">Line quantities live on this page. Checkout uses the same dummy tender the agent already has — card digits stay in the form.</p>
      <div id="cart-root"></div>
      <form id="cart-checkout" class="panel">
        <h2>Dummy checkout</h2>
        <label>Name <input name="customerName" maxlength="80" required autocomplete="name"></label>
        <label>Fulfillment
          <select name="fulfillment">
            <option value="pickup">Pickup</option>
            <option value="delivery">Delivery</option>
          </select>
        </label>
        <label>Dummy card <input name="card" inputmode="numeric" autocomplete="off" placeholder="4242424242424242" maxlength="19"></label>
        <label>Expiry <input name="expiry" autocomplete="off" placeholder="12/28" maxlength="7"></label>
        <label>CVV <input name="cvv" autocomplete="off" inputmode="numeric" placeholder="123" maxlength="4"></label>
        <label>Mandate (optional dummy JWT) <input name="mandate" autocomplete="off"></label>
        <button type="submit">Place demo order</button>
        <p class="note" data-checkout-note></p>
      </form>
      <p><a href="./shop.html">Back to the shop</a></p>
      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
