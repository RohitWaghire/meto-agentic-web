<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop — meto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="wrap">
      <header class="site-header" id="site-header"></header>
      <h1>Shop</h1>
      <p class="lede">The same catalog the assistant reads. Filter by what the floor actually holds.</p>
      <form id="shop-filters" class="filters">
        <label>Search <input id="shop-q" name="q" type="search"></label>
        <label>Category
          <select id="shop-category">
            <option value="">All</option>
            <option value="lighting">Lighting</option>
            <option value="textiles">Textiles</option>
            <option value="objects">Objects</option>
          </select>
        </label>
        <label>Max $ <input id="shop-max" type="number" min="0" step="1"></label>
      </form>
      <p class="note" id="cart-note"></p>
      <div class="grid" id="shop-grid"></div>
      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
