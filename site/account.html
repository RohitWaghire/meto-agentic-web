<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="./styles.css">

  <body>

      <header class="site-header">

      <h1>Account</h1>
      <p>Signed in as <strong id="signed-in">Guest</strong>.</p>
      <form id="login-form" class="panel">
        <label>Email <input name="email" value="julian@orra.example"></label>

        <button type="submit">Sign in</button>
        <button type="button" class="ghost" id="logout-button">Sign out</button>
        <p id="login-note" class="note"></p>
      </form>
      <p>Demo: maya@orra.example / demo1234 · julian@orra.example / studio1234 · ada@orra.example / admin1234</p>
