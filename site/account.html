<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account — meto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="wrap">
      <header class="site-header" id="site-header"></header>
      <h1>Account</h1>
      <p>Signed in as <strong id="signed-in">Guest</strong>.</p>
      <form id="login-form" class="panel">
        <label>Email <input name="email" value="julian@meto.example"></label>
        <label>Password <input name="password" type="password" value="studio1234"></label>
        <button type="submit">Sign in</button>
        <button type="button" class="ghost" id="logout-button">Sign out</button>
        <p id="login-note" class="note"></p>
      </form>
      <p>Demo: maya@meto.example / demo1234 · julian@meto.example / studio1234 · ada@meto.example / admin1234</p>
      <section class="panel">
        <h2>Saved dummy tender</h2>
        <p id="saved-tender">No dummy tender saved.</p>
        <p class="note">Last four digits only. The PAN never leaves the checkout form.</p>
      </section>
      <section class="panel">
        <h2>Order history</h2>
        <ul id="order-history"><li>No orders yet.</li></ul>
      </section>
      <p><a href="./permissions.html">Permissions</a> · <a href="./index.html#assistant">Ask meto</a></p>
      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
